# Fail-closed forward proxy: only CONNECT to OpenRouter is allowed.
# Everything else is denied by the trailing `http_access deny all`.

acl allowed_domains dstdomain .openrouter.ai

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow CONNECT SSL_ports allowed_domains
http_access allow allowed_domains
http_access deny all

http_port 3128

# Don't cache anything, and don't leak the client's internal IP.
cache deny all
forwarded_for delete
via off

access_log /var/log/squid/access.log squid
